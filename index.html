<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annuaire Entreprise</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="back-nav" id="backNav">
        <button class="back-btn" id="backBtn">
            <svg viewBox="0 0 24 24">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
            </svg>
            Retour
        </button>
    </div>

    <header id="mainHeader">
        <h1>Annuaire</h1>
        <p class="subtitle">Contacts Rapides</p>
    </header>

    <main>
        <div id="categoryGrid" class="category-grid">
            <!-- Categories will be injected here -->
        </div>

        <div id="detailView" class="detail-view">
            <!-- Details will be injected here -->
        </div>
    </main>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f0f13">
    <div id="installBanner" class="install-banner hidden">
        <div class="banner-content">
            <div class="banner-text">
                <h3>Installer l'application</h3>
                <p>Accédez à l'annuaire plus rapidement</p>
            </div>
            <div class="banner-actions">
                <button id="dismissBtn" class="btn-dismiss">Plus tard</button>
                <button id="installBtn" class="btn-install">Installer</button>
            </div>
        </div>
    </div>

    <script>
        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('Service Worker Registered'))
                .catch((err) => console.log('Service Worker Failed', err));
        }

        // Install Banner Logic
        let deferredPrompt;
        const installBanner = document.getElementById('installBanner');
        const installBtn = document.getElementById('installBtn');
        const dismissBtn = document.getElementById('dismissBtn');

        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            installBanner.classList.remove('hidden');
        });

        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`User response to the install prompt: ${outcome}`);
                deferredPrompt = null;
                installBanner.classList.add('hidden');
            }
        });

        dismissBtn.addEventListener('click', () => {
            installBanner.classList.add('hidden');
        });
    </script>
    <script src="data.js"></script>
    <script type="module" src="script.js"></script>
</body>

</html>
