<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annuaire Entreprise</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div class="back-nav" id="backNav">
        <button class="back-btn" id="backBtn">
            <svg viewBox="0 0 24 24">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
            </svg>
            Retour
        </button>
    </div>

    <header id="mainHeader">
        <h1>Annuaire</h1>
        <p class="subtitle">Contacts Rapides</p>
    </header>

    <main>
        <div id="categoryGrid" class="category-grid">
            <!-- Categories will be injected here -->
        </div>

        <div id="detailView" class="detail-view">
            <!-- Details will be injected here -->
        </div>
    </main>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f0f13">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Annuaire">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Bandeau d'installation -->
    <div id="installBanner" class="install-banner hidden">
        <div class="banner-content">
            <div class="banner-text">
                <h3>📱 Installer l'application</h3>
                <p>Accès rapide depuis votre écran d'accueil</p>
            </div>
            <div class="banner-actions">
                <button id="dismissBtn" class="btn-dismiss">Plus tard</button>
                <button id="installBtn" class="btn-install">Installer</button>
            </div>
        </div>
    </div>

    <script>
        // Service Worker Registration
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then((reg) => {
                    console.log('✅ Service Worker enregistré');
                    reg.update();
                })
                .catch((err) => console.error('❌ Service Worker échoué:', err));
        }

        // Installation PWA
        let deferredPrompt = null;
        const installBanner = document.getElementById('installBanner');
        const installBtn = document.getElementById('installBtn');
        const dismissBtn = document.getElementById('dismissBtn');
        const bannerText = document.querySelector('.banner-text p');

        // Détection iOS
        const isIos = /iPhone|iPad|iPod/.test(navigator.userAgent) && !window.MSStream;
        const isAppInstalled = localStorage.getItem('appInstalled') === 'true';

        // Sur iOS, afficher un guide spécifique
        if (isIos && !isAppInstalled && !window.navigator.standalone) {
            installBanner.classList.remove('hidden');
            bannerText.innerText = "Sur iOS : Appuyez sur Partager ⎋ puis 'Sur l'écran d'accueil' ➕";
            installBtn.style.display = 'none'; // Pas de bouton install sur iOS
        }

        // Sur Android/PC : Attendre l'événement officiel
        window.addEventListener('beforeinstallprompt', (e) => {
            console.log('✅ beforeinstallprompt déclenché');
            e.preventDefault();
            deferredPrompt = e;
            installBanner.classList.remove('hidden');
        });

        // Bouton Installer (Android/PC seulement)
        installBtn.addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                console.log(`👤 Choix utilisateur: ${outcome}`);
                deferredPrompt = null;
                if (outcome === 'accepted') {
                    localStorage.setItem('appInstalled', 'true');
                }
                installBanner.classList.add('hidden');
            }
        });

        // Bouton Fermer
        dismissBtn.addEventListener('click', () => {
            installBanner.classList.add('hidden');
        });

        // Détecter l'installation réussie
        window.addEventListener('appinstalled', () => {
            console.log('✅ App installée !');
            localStorage.setItem('appInstalled', 'true');
            installBanner.classList.add('hidden');
        });
    </script>
    <script src="data.js"></script>
    <script type="module" src="script.js"></script>
</body>

</html>
